class = "warrior"
account = "LABPAYATH"
level = 20
tele = "Brill"
job = "pay"
args = "at=guild_master gold=10000 ref=4"
money = 20000

# kit with vendor-only items, on a core with or without the vault: a human at Stormwind's tele, 58 yards from the
# Guild Master, with no vault row for its account. Moonberry Juice (1645) is sold by Thurman Mullby and Ben Trias,
# Sacred Candle (17029) by Keldric and Kyra Boucher, all within 70 yards; no vendor sells Major Mana Potion (13444).
# Expect: `on its way to buy ... from ...` twice, then done `kitted lab_vendor; short 5 Major Mana Potion`,
# 20 juice and 10 candles in its bags, about 1g 80s spent, and a `kitted` event
# `loadout=lab_vendor bought=1645:20,17029:10 spent=18000 short=13444:5` (the spend lower with a reputation discount).
[[worker]]
name = "Kitvendor"
race = "human"
class = "priest"
account = "LABKIT"
level = 50
tele = "Stormwind"
job = "kit"
args = "loadout=lab_vendor items=1645:20,17029:10,13444:5"
money = 50000

# kit short of gold: the same order with 50 silver. Expect: done, short, with `; out of gold`, and a few silver left
# at most; not failed, since being short is done.
[[worker]]
name = "Kitpoor"
race = "human"
class = "priest"
account = "LABKIT"
level = 50
tele = "Stormwind"
job = "kit"
args = "loadout=lab_vendor items=1645:20,17029:10,13444:5"
money = 5000

# NEEDS THE VAULT CORE (the core fork's competition branch and 031-vault.sql in the lab's world database).
# kit from the vault, then vendors: an orc at Orgrimmar's tele, about 95 yards from Urtrun Clanbringer.
# Before the server starts (the vault is read at startup), in the characters database:
#   REPLACE INTO guildd_account VALUES (<LABVAULT's account id>, 'lab-vault');
#   REPLACE INTO guildbot_vault VALUES ('lab-vault', 13444, 3);
# Expect: `on its way to the vaultkeeper in Orgrimmar`, 3 Major Mana Potion taken, then the juice bought from a vendor
# in Orgrimmar, done `kitted lab_vault; short 2 Major Mana Potion`, an event
# `loadout=lab_vault vault=13444:3 bought=1645:5 spent=2000 short=13444:2`, and no 13444 row left in guildbot_vault.
[[worker]]
name = "Kitvault"
race = "orc"
class = "shaman"
account = "LABVAULT"
level = 50
tele = "Orgrimmar"
job = "kit"
args = "loadout=lab_vault items=13444:5,1645:5"
money = 20000

# NEEDS THE VAULT CORE, and the guildd_account row above for the same account.
# deposit: all its Major Mana Potions, its Hearthstone (soulbound) and 10 Moonberry Juice of the 4 it carries.
# Expect: `on its way to the vaultkeeper in Orgrimmar`, then done
# `deposited 5 Major Mana Potion, 4 Moonberry Juice; refused 1 Hearthstone (Soulbound items cannot go in the vault); carries 4 of 10 Moonberry Juice`,
# a `deposited` event `seq=<its job_seq> items=13444:5,1645:4`, the Hearthstone still in its bags, and guildbot_vault
# up by 5 and 4. On a core without the vault the same order fails at once with `this server has no guild vault`.
[[worker]]
name = "Depositor"
race = "orc"
class = "warrior"
account = "LABVAULT"
level = 50
tele = "Orgrimmar"
job = "deposit"
args = "items=13444:0,6948:1,1645:10"
items = ["13444:5", "1645:4"]

# NEEDS THE VAULT CORE, and the guildd_account row above for the same account.
# deposit gold above a keep: 6g carried, 1g kept back. Expect: `on its way to the vaultkeeper in Orgrimmar`, then done
# `deposited 5g`, a `deposited` event `seq=<its job_seq> gold=50000`, 1g left on it, guildbot_vault_gold for
# 'lab-vault' up by 50000 and a guildbot_vault_log line with item 0 and delta 50000.
[[worker]]
name = "Golddepositor"
race = "orc"
class = "warrior"
account = "LABVAULT"
level = 50
tele = "Orgrimmar"
job = "deposit"
args = "gold=0 keep=10000"
money = 60000

# NEEDS THE VAULT CORE. A second guild, so its gold is not the depositor's:
#   REPLACE INTO guildd_account VALUES (<LABVAULTG's account id>, 'lab-vault-gold');
#   REPLACE INTO guildbot_vault_gold VALUES ('lab-vault-gold', 100000);
#   REPLACE INTO guildbot_vault VALUES ('lab-vault-gold', 13444, 2);
# withdraw: 3g and all the Major Mana Potions. Expect: done `took 3g and 2 Major Mana Potion`, a `withdrew` event
# `seq=<its job_seq> items=13444:2 gold=30000`, 3g 50s on it, and the 13444 row gone.
[[worker]]
name = "Goldtaker"
race = "orc"
class = "warrior"
account = "LABVAULTG"
level = 50
tele = "Orgrimmar"
job = "withdraw"
args = "items=13444:0 gold=30000"
money = 5000

# NEEDS THE VAULT CORE, and the lab-vault-gold rows above. pay at a counter with 1g of 5g: the vault makes up 4g.
# Expect: it sets out, done `paid 5g (ref 5) to the Guild Master in Orgrimmar, 4g of it from the vault`, a `paid` event
# `ref=5 gold=50000`, no gold left on it, and the vault's gold down by 40000 (with Goldtaker's 30000, 30000 left).
# On a core without the vault it fails at once with `has 1g, needs 5g`.
[[worker]]
name = "Payvault"
race = "orc"
class = "warrior"
account = "LABVAULTG"
level = 50
tele = "Orgrimmar"
job = "pay"
args = "at=guild_master gold=50000 ref=5"
money = 10000
